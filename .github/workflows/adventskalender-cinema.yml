name: Adventskalender Blender-Kino
on:
  push:
    branches: [adventskalender-bender]
    paths:
      - '.github/workflows/adventskalender-cinema.yml'
      - 'adventskalender/cinema/animate.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: adventskalender-cinema
  cancel-in-progress: true
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Blender 4.5 LTS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgl1-mesa-dri libegl1 libxkbcommon0 libxi6 libxrender1 libxfixes3 libx11-6 libsm6 xvfb
          curl -fsSL --retry 3 https://download.blender.org/release/Blender4.5/blender-4.5.0-linux-x64.tar.xz -o /tmp/blender.tar.xz
          mkdir -p /tmp/blender
          tar -xJf /tmp/blender.tar.xz --strip-components=1 -C /tmp/blender
      - name: Export and validate 24 animated Blender scenes
        working-directory: adventskalender
        run: |
          xvfb-run -a /tmp/blender/blender -b -t 4 --python-exit-code 1 --python cinema/animate.py -- --all
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('renders/cinema')
          m=json.loads((p/'manifest.json').read_text())
          assert [c['day'] for c in m['chapters']]==list(range(1,25))
          assert all((p/c['file']).stat().st_size==c['bytes'] for c in m['chapters'])
          assert sum(c['bytes'] for c in m['chapters'])<180*1024*1024
          print('All 24 Blender animations validated')
          PY
      - name: Publish complete validated animation bundle
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add adventskalender/renders/cinema/*.glb adventskalender/renders/cinema/manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish 24 Blender-authored animated cutscenes'
          git pull --rebase origin adventskalender-bender
          git push origin HEAD:adventskalender-bender
      - uses: actions/upload-artifact@v4
        with:
          name: furzipups-editable-blender-scene
          path: adventskalender/renders/cinema/chapter-03.blend
          retention-days: 3
