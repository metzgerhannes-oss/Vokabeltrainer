name: Import pinned French OCR model

on:
  push:
    branches: [feature/french-b003-v02153]
    paths:
      - '.github/workflows/import-french-ocr.yml'

permissions:
  contents: write

jobs:
  import-french-ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feature/french-b003-v02153
          fetch-depth: 0

      - name: Fetch pinned tessdata_fast French model
        run: |
          set -euo pipefail
          mkdir -p ocr/lang
          curl -L --fail --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/87416418657359cb625c412a48b6e1d6d41c29bd/fra.traineddata \
            -o ocr/lang/fra.traineddata
          test "$(git hash-object ocr/lang/fra.traineddata)" = "d9e2b2160be0d1ca3b8f1bf2730fae476ef3b4a6"
          test "$(stat -c%s ocr/lang/fra.traineddata)" = "1130365"

      - name: Commit verified OCR model
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ocr/lang/fra.traineddata
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "asset: add pinned French OCR model"
          git push origin HEAD:feature/french-b003-v02153
