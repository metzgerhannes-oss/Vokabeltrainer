name: Deploy Vokabeltrainer to GitHub Pages

on:
  workflow_run:
    workflows: ["Vokabeltrainer CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

      - name: Verify live deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          EXPECTED_VERSION="$(sed -n "s/^const VERSION = '\([^']*\)';$/\1/p" js/core.js)"
          test -n "$EXPECTED_VERSION"
          BASE="${PAGE_URL%/}"
          OK=0

          for i in {1..20}; do
            HTML="$(curl -fsSL --max-time 15 "$BASE/index.html?release=$EXPECTED_SHA" || true)"
            CORE="$(curl -fsSL --max-time 15 "$BASE/js/core.js?release=$EXPECTED_SHA" || true)"
            SW="$(curl -fsSL --max-time 15 "$BASE/sw.js?release=$EXPECTED_SHA" || true)"

            if printf '%s' "$HTML" | grep -Fq ">v$EXPECTED_VERSION</span>" \
              && printf '%s' "$CORE" | grep -Fq "const VERSION = '$EXPECTED_VERSION';" \
              && printf '%s' "$SW" | grep -Fq "APP_VERSION='$EXPECTED_VERSION'"; then
              OK=1
              break
            fi
            sleep 3
          done

          if [ "$OK" -ne 1 ]; then
            echo "Live deployment did not expose expected version $EXPECTED_VERSION for commit $EXPECTED_SHA."
            exit 1
          fi

          echo "Live GitHub Pages deployment verified at version $EXPECTED_VERSION."
