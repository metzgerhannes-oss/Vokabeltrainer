<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Französisch – Avatar- und Weltlayout</title>
  <desc id="desc">Visuelle Konzeptreferenz für Voyage Français im Vokabeltrainer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f1df"/><stop offset="1" stop-color="#d7e0d5"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8cedd"/><stop offset="1" stop-color="#f5d9b3"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#294d67"/><stop offset="1" stop-color="#426d80"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#34474f" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="40" y="35" width="1520" height="110" rx="28" fill="url(#blue)" filter="url(#shadow)"/>
  <text x="95" y="88" fill="#fff8e8" font-family="Georgia,serif" font-size="46" font-weight="700">FRANZÖSISCH · VOYAGE FRANÇAIS</text>
  <text x="98" y="124" fill="#dbe6e4" font-family="Arial,sans-serif" font-size="22">Reisefigur links · Weg und Orte in der Mitte · besondere Etappe rechts</text>

  <!-- Avatar -->
  <rect x="55" y="180" width="480" height="525" rx="34" fill="#fffaf0" stroke="#9da99e" stroke-width="3" filter="url(#shadow)"/>
  <text x="88" y="225" fill="#294d67" font-family="Arial,sans-serif" font-size="28" font-weight="700">AVATAR</text>
  <text x="88" y="255" fill="#5d6864" font-family="Arial,sans-serif" font-size="18">zivil · neugierig · kultiviert · nicht kostümiert</text>
  <!-- timeless young traveler -->
  <ellipse cx="292" cy="615" rx="120" ry="18" fill="#4b5b5b" opacity=".14"/>
  <circle cx="292" cy="329" r="66" fill="#ddb086"/>
  <path d="M235 320 Q245 250 294 248 Q342 250 351 317 Q320 283 287 292 Q258 301 235 320 Z" fill="#5c4638"/>
  <path d="M224 438 Q292 392 360 438 L349 626 Q292 655 235 626 Z" fill="#557585"/>
  <path d="M240 439 Q292 410 344 439 L327 618 Q292 637 257 618 Z" fill="#d5d0bd"/>
  <rect x="260" y="390" width="64" height="48" rx="20" fill="#d8a47d"/>
  <circle cx="268" cy="327" r="6" fill="#3d332e"/><circle cx="317" cy="327" r="6" fill="#3d332e"/>
  <path d="M256 349 Q292 372 328 349" fill="none" stroke="#80563f" stroke-width="5" stroke-linecap="round"/>
  <!-- shoulder bag -->
  <path d="M339 441 Q414 500 389 620" fill="none" stroke="#8a6d4b" stroke-width="14" stroke-linecap="round"/>
  <rect x="350" y="535" width="82" height="74" rx="12" fill="#92734f"/>
  <!-- notebook -->
  <rect x="167" y="492" width="92" height="118" rx="8" fill="#f1e6ca" stroke="#6d6253" stroke-width="4" transform="rotate(-8 213 551)"/>
  <line x1="210" y1="490" x2="210" y2="607" stroke="#b7a98d" stroke-width="2" transform="rotate(-8 213 551)"/>
  <path d="M363 472 L423 430" stroke="#6d6253" stroke-width="10" stroke-linecap="round"/>
  <path d="M420 426 l22 5 -14 18z" fill="#6d6253"/>
  <text x="91" y="674" fill="#5d6864" font-family="Arial,sans-serif" font-size="17">Keine Waffe, Krone, Uniform, Baskenmütze oder Ringelshirt-Pflicht.</text>

  <!-- World -->
  <rect x="565" y="180" width="980" height="525" rx="34" fill="#fffaf0" stroke="#9da99e" stroke-width="3" filter="url(#shadow)"/>
  <text x="600" y="225" fill="#294d67" font-family="Arial,sans-serif" font-size="28" font-weight="700">WELT · ENTDECKUNGSREISE</text>
  <rect x="592" y="265" width="925" height="395" rx="26" fill="url(#sky)"/>
  <!-- landscape -->
  <path d="M592 464 Q720 342 845 430 Q975 318 1110 430 Q1265 330 1517 420 L1517 660 L592 660 Z" fill="#7f9a73"/>
  <path d="M592 530 Q750 470 890 515 Q1040 450 1190 520 Q1360 455 1517 520 L1517 660 L592 660 Z" fill="#d2bb7d"/>
  <!-- river -->
  <path d="M607 605 C770 565 875 625 1005 568 S1220 480 1510 505" fill="none" stroke="#8ab4c6" stroke-width="52" stroke-linecap="round" opacity=".95"/>
  <path d="M607 605 C770 565 875 625 1005 568 S1220 480 1510 505" fill="none" stroke="#d6edf1" stroke-width="5" stroke-dasharray="22 18" opacity=".7"/>
  <!-- route -->
  <path d="M650 620 C760 555 860 560 960 520 S1170 430 1448 356" fill="none" stroke="#f3e8cf" stroke-width="22" stroke-linecap="round"/>
  <path d="M650 620 C760 555 860 560 960 520 S1170 430 1448 356" fill="none" stroke="#7d8d83" stroke-width="3" stroke-dasharray="10 15"/>
  <!-- village -->
  <g transform="translate(622 520)">
    <rect x="0" y="35" width="52" height="42" fill="#ead7b2"/><path d="M-5 35 l31 -27 31 27z" fill="#a85f45"/>
    <rect x="58" y="28" width="45" height="49" fill="#e5cfaa"/><path d="M53 28 l28 -24 28 24z" fill="#8f5844"/>
  </g>
  <!-- market -->
  <g transform="translate(855 468)">
    <rect x="0" y="38" width="100" height="55" fill="#e6d7bd"/><path d="M-5 38 l55 -35 55 35z" fill="#9f6d50"/>
    <rect x="18" y="68" width="18" height="25" fill="#78956c"/><rect x="64" y="68" width="18" height="25" fill="#78956c"/>
  </g>
  <!-- station -->
  <g transform="translate(1050 405)">
    <rect x="0" y="30" width="115" height="76" fill="#ded1b5"/><path d="M-8 30 l66 -38 66 38z" fill="#6b7f7a"/>
    <circle cx="57" cy="22" r="14" fill="#fff4dd" stroke="#536963" stroke-width="4"/><line x1="57" y1="22" x2="57" y2="12" stroke="#536963" stroke-width="3"/><line x1="57" y1="22" x2="65" y2="27" stroke="#536963" stroke-width="3"/>
  </g>
  <!-- bridge -->
  <path d="M1215 500 H1350" stroke="#d7c6a5" stroke-width="18"/><path d="M1225 500 Q1250 465 1275 500 M1280 500 Q1305 465 1330 500" fill="none" stroke="#c3ad88" stroke-width="10"/>
  <!-- coast / destination -->
  <g transform="translate(1385 290)">
    <path d="M0 120 Q55 40 110 120 Z" fill="#8d9d75"/>
    <rect x="38" y="62" width="74" height="58" fill="#e6d2ae"/><path d="M30 62 l46 -34 46 34z" fill="#6b7b78"/>
    <rect x="65" y="38" width="18" height="24" fill="#c9b58f"/>
  </g>

  <!-- milestones -->
  <g font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">
    <circle cx="672" cy="611" r="17" fill="#3e6575"/><text x="672" y="617" fill="white">1</text>
    <circle cx="845" cy="555" r="17" fill="#3e6575"/><text x="845" y="561" fill="white">2</text>
    <circle cx="980" cy="512" r="17" fill="#3e6575"/><text x="980" y="518" fill="white">3</text>
    <circle cx="1140" cy="454" r="17" fill="#3e6575"/><text x="1140" y="460" fill="white">4</text>
    <circle cx="1290" cy="401" r="17" fill="#3e6575"/><text x="1290" y="407" fill="white">5</text>
    <circle cx="1446" cy="354" r="17" fill="#b68c47"/><text x="1446" y="360" fill="#3c3d38">6</text>
  </g>
  <g font-family="Arial,sans-serif" font-size="16" fill="#3d4a48" text-anchor="middle">
    <text x="672" y="647">Village</text><text x="845" y="593">Marché</text><text x="980" y="550">Gare</text>
    <text x="1140" y="492">Rivière</text><text x="1290" y="439">Côte</text><text x="1446" y="392">Grande Étape</text>
  </g>

  <!-- progression -->
  <rect x="55" y="738" width="1490" height="125" rx="28" fill="#f7f1e4" stroke="#9da99e" stroke-width="2"/>
  <text x="86" y="777" fill="#294d67" font-family="Arial,sans-serif" font-size="20" font-weight="700">AVATAR-ENTWICKLUNG · ausschließlich Reise / Sprache</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g transform="translate(280 0)"><circle cx="0" cy="797" r="24" fill="#426d80"/><text x="0" y="804" fill="white" font-size="18">1</text><text x="0" y="842" fill="#3d4a48" font-size="17">Entdecker</text></g>
    <g transform="translate(470 0)"><circle cx="0" cy="797" r="24" fill="#426d80"/><text x="0" y="804" fill="white" font-size="18">2</text><text x="0" y="842" fill="#3d4a48" font-size="17">Reisender</text></g>
    <g transform="translate(660 0)"><circle cx="0" cy="797" r="24" fill="#426d80"/><text x="0" y="804" fill="white" font-size="18">3</text><text x="0" y="842" fill="#3d4a48" font-size="17">Wegfinder</text></g>
    <g transform="translate(850 0)"><circle cx="0" cy="797" r="24" fill="#426d80"/><text x="0" y="804" fill="white" font-size="18">4</text><text x="0" y="842" fill="#3d4a48" font-size="17">Sprachreisender</text></g>
    <g transform="translate(1060 0)"><circle cx="0" cy="797" r="24" fill="#426d80"/><text x="0" y="804" fill="white" font-size="18">5</text><text x="0" y="842" fill="#3d4a48" font-size="17">Kulturkenner</text></g>
    <g transform="translate(1280 0)"><circle cx="0" cy="797" r="24" fill="#b68c47"/><text x="0" y="804" fill="#3d4a48" font-size="18">6</text><text x="0" y="842" fill="#3d4a48" font-size="17">Grand Voyageur</text></g>
  </g>
</svg>