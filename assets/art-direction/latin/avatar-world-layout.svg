<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Latein – Avatar- und Weltlayout</title>
  <desc id="desc">Visuelle Konzeptreferenz für die römische Lateinwelt des Vokabeltrainers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6ead2"/><stop offset="1" stop-color="#d9c08f"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9c9d7"/><stop offset="1" stop-color="#f3d7a2"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7f241f"/><stop offset="1" stop-color="#a63a2d"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4a447"/><stop offset="1" stop-color="#8a5c22"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#533c25" flood-opacity=".2"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="40" y="35" width="1520" height="110" rx="28" fill="url(#red)" filter="url(#shadow)"/>
  <text x="95" y="88" fill="#fff3d2" font-family="Georgia,serif" font-size="46" font-weight="700">LATEIN · DIE RÖMISCHE EXPEDITION</text>
  <text x="98" y="124" fill="#f0d9a4" font-family="Arial,sans-serif" font-size="22">Avatar links · Marschroute in der Mitte · Kastell / Jahresziel rechts</text>

  <!-- Avatar card -->
  <rect x="55" y="180" width="480" height="525" rx="34" fill="#fff8e9" stroke="#b89458" stroke-width="3" filter="url(#shadow)"/>
  <text x="88" y="225" fill="#6f2b24" font-family="Arial,sans-serif" font-size="28" font-weight="700">AVATAR</text>
  <text x="88" y="255" fill="#6d5a43" font-family="Arial,sans-serif" font-size="18">ruhig · würdevoll · historisch angehaucht</text>

  <!-- Stylised young legionary -->
  <ellipse cx="292" cy="392" rx="112" ry="18" fill="#6d5131" opacity=".18"/>
  <path d="M190 445 Q292 382 394 445 L382 618 Q292 668 202 618 Z" fill="#7b2c25"/>
  <path d="M225 430 Q292 392 359 430 L340 610 Q292 638 244 610 Z" fill="#b07a39"/>
  <rect x="254" y="388" width="76" height="52" rx="22" fill="#d79b6e"/>
  <circle cx="292" cy="330" r="67" fill="#e1a879"/>
  <path d="M233 320 Q245 246 292 244 Q346 245 354 320 Z" fill="url(#bronze)"/>
  <rect x="235" y="306" width="118" height="18" rx="8" fill="#9b6727"/>
  <path d="M287 244 Q300 190 331 205 Q343 214 332 232 Q319 248 287 264 Z" fill="#8e3027"/>
  <path d="M252 342 Q272 358 292 358 Q312 358 332 342" fill="none" stroke="#7c4a32" stroke-width="5" stroke-linecap="round"/>
  <circle cx="267" cy="327" r="6" fill="#3e3029"/><circle cx="317" cy="327" r="6" fill="#3e3029"/>
  <path d="M186 468 Q155 492 159 608 Q186 647 225 619 L226 476 Z" fill="#8f2f27"/>
  <path d="M376 466 Q425 485 424 598 Q399 632 364 612 L361 478 Z" fill="#a46f34"/>
  <path d="M147 430 L236 430 L226 650 L145 629 Z" fill="#9d3027" stroke="#d6a34b" stroke-width="6"/>
  <path d="M186 461 l22 44 -22 63 -22-63z" fill="#d7ad55"/>
  <path d="M183 603 L404 476" stroke="#7e572e" stroke-width="18" stroke-linecap="round"/>
  <path d="M390 463 l39 -18 -18 39z" fill="#b9b5a6"/>
  <circle cx="402" cy="476" r="10" fill="#8a5a26"/>
  <text x="92" y="676" fill="#6d5a43" font-family="Arial,sans-serif" font-size="17">Scutum, Bronze, gedecktes Rot; keine brutale Kampfpose.</text>

  <!-- World card -->
  <rect x="565" y="180" width="980" height="525" rx="34" fill="#fff8e9" stroke="#b89458" stroke-width="3" filter="url(#shadow)"/>
  <text x="600" y="225" fill="#6f2b24" font-family="Arial,sans-serif" font-size="28" font-weight="700">WELT · PROVINZROUTE</text>
  <rect x="592" y="265" width="925" height="395" rx="26" fill="url(#sky)"/>
  <!-- hills / mediterranean -->
  <path d="M592 460 Q720 330 865 420 Q1000 310 1140 430 Q1290 315 1517 435 L1517 660 L592 660 Z" fill="#8b9a64"/>
  <path d="M592 520 Q760 455 930 515 Q1105 438 1270 520 Q1388 470 1517 520 L1517 660 L592 660 Z" fill="#c7b06e"/>
  <!-- road -->
  <path d="M650 625 C780 570 850 590 965 520 S1170 430 1460 352" fill="none" stroke="#e9d9b2" stroke-width="26" stroke-linecap="round"/>
  <path d="M650 625 C780 570 850 590 965 520 S1170 430 1460 352" fill="none" stroke="#b59d70" stroke-width="3" stroke-dasharray="10 14"/>
  <!-- aqueduct -->
  <path d="M820 490 H1040" stroke="#d8c7a2" stroke-width="18"/>
  <path d="M840 490 V548 M890 490 V548 M940 490 V548 M990 490 V548 M1035 490 V548" stroke="#c7b18a" stroke-width="12"/>
  <path d="M835 548 Q865 505 895 548 M885 548 Q915 505 945 548 M935 548 Q965 505 995 548 M985 548 Q1015 505 1045 548" fill="none" stroke="#c7b18a" stroke-width="10"/>
  <!-- camp -->
  <path d="M650 565 l48 -72 48 72z" fill="#b04834"/><rect x="671" y="565" width="55" height="34" fill="#e7d0a5"/>
  <!-- forum -->
  <rect x="930" y="445" width="98" height="58" fill="#e3d3b3"/><path d="M920 445 l59 -42 59 42z" fill="#c6b08a"/>
  <rect x="944" y="455" width="10" height="42" fill="#f3e6cb"/><rect x="970" y="455" width="10" height="42" fill="#f3e6cb"/><rect x="996" y="455" width="10" height="42" fill="#f3e6cb"/>
  <!-- fort -->
  <rect x="1252" y="350" width="122" height="92" fill="#b08d5f"/><rect x="1240" y="330" width="35" height="112" fill="#9a774e"/><rect x="1350" y="330" width="35" height="112" fill="#9a774e"/>
  <path d="M1238 330 l18 -25 19 25z M1348 330 l18 -25 19 25z" fill="#8b5d3d"/>
  <!-- capitol target -->
  <rect x="1415" y="285" width="76" height="58" fill="#ead9b7"/><path d="M1400 285 l53 -36 53 36z" fill="#cbb180"/>
  <rect x="1424" y="290" width="8" height="45" fill="#fff1d2"/><rect x="1449" y="290" width="8" height="45" fill="#fff1d2"/><rect x="1474" y="290" width="8" height="45" fill="#fff1d2"/>
  <!-- milestones -->
  <g font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">
    <circle cx="676" cy="605" r="17" fill="#8f2f27"/><text x="676" y="611" fill="white">1</text>
    <circle cx="845" cy="555" r="17" fill="#8f2f27"/><text x="845" y="561" fill="white">2</text>
    <circle cx="978" cy="508" r="17" fill="#8f2f27"/><text x="978" y="514" fill="white">3</text>
    <circle cx="1150" cy="445" r="17" fill="#8f2f27"/><text x="1150" y="451" fill="white">4</text>
    <circle cx="1300" cy="385" r="17" fill="#8f2f27"/><text x="1300" y="391" fill="white">5</text>
    <circle cx="1453" cy="337" r="17" fill="#d1a342"/><text x="1453" y="343" fill="#4d3822">6</text>
  </g>
  <g font-family="Arial,sans-serif" font-size="16" fill="#4d3822" text-anchor="middle">
    <text x="676" y="646">Marschlager</text><text x="845" y="593">Via</text><text x="978" y="545">Forum</text>
    <text x="1150" y="483">Provinz</text><text x="1300" y="470">Kastell</text><text x="1453" y="377">Kapitol</text>
  </g>

  <!-- Progression strip -->
  <rect x="55" y="738" width="1490" height="125" rx="28" fill="#f8edd8" stroke="#b89458" stroke-width="2"/>
  <text x="86" y="777" fill="#6f2b24" font-family="Arial,sans-serif" font-size="20" font-weight="700">AVATAR-ENTWICKLUNG</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g transform="translate(280 0)"><circle cx="0" cy="797" r="24" fill="#a34435"/><text x="0" y="804" fill="white" font-size="18">1</text><text x="0" y="842" fill="#4e3d2b" font-size="17">Tiro</text></g>
    <g transform="translate(470 0)"><circle cx="0" cy="797" r="24" fill="#a34435"/><text x="0" y="804" fill="white" font-size="18">2</text><text x="0" y="842" fill="#4e3d2b" font-size="17">Legionär</text></g>
    <g transform="translate(660 0)"><circle cx="0" cy="797" r="24" fill="#a34435"/><text x="0" y="804" fill="white" font-size="18">3</text><text x="0" y="842" fill="#4e3d2b" font-size="17">Optio</text></g>
    <g transform="translate(850 0)"><circle cx="0" cy="797" r="24" fill="#a34435"/><text x="0" y="804" fill="white" font-size="18">4</text><text x="0" y="842" fill="#4e3d2b" font-size="17">Centurio</text></g>
    <g transform="translate(1040 0)"><circle cx="0" cy="797" r="24" fill="#a34435"/><text x="0" y="804" fill="white" font-size="18">5</text><text x="0" y="842" fill="#4e3d2b" font-size="17">Tribun</text></g>
    <g transform="translate(1230 0)"><circle cx="0" cy="797" r="24" fill="#d1a342"/><text x="0" y="804" fill="#4d3822" font-size="18">6</text><text x="0" y="842" fill="#4e3d2b" font-size="17">Legat</text></g>
  </g>
</svg>