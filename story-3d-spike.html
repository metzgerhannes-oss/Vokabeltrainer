<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vokabeltrainer · 3D Festungsenthüllung Spike</title>
<style>
html,body{margin:0;background:#1d292d;color:#fff;font-family:system-ui,-apple-system,sans-serif}body{min-height:100vh;display:grid;place-items:center}.story3d-shell{width:min(100vw,1100px);padding:16px;box-sizing:border-box}.story3d-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:10px}.story3d-head h1{font-size:18px;margin:0}.story3d-head small{opacity:.72}.story3d-stage{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:22px;background:#9fb9c8;box-shadow:0 18px 55px #0008}.story3d-stage canvas{display:block;width:100%;height:100%}.story3d-overlay{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:flex-end;padding:18px;box-sizing:border-box;pointer-events:none;background:linear-gradient(transparent 60%,#0009)}.story3d-overlay div{display:grid;gap:2px;text-shadow:0 2px 8px #000}.story3d-overlay strong{font-family:Georgia,serif;font-size:clamp(24px,5vw,44px)}.story3d-overlay small{font-weight:700;letter-spacing:.1em;text-transform:uppercase}.story3d-skip{pointer-events:auto;border:1px solid #ffffff88;background:#1119;color:#fff;border-radius:999px;padding:10px 14px;font-weight:700}.story3d-fallback{height:100%;position:relative;overflow:hidden;background:linear-gradient(#b8cfdd 0 58%,#617457 58%)}.story3d-fallback-hill{position:absolute;width:120%;height:44%;left:-10%;bottom:-17%;border-radius:50%;background:#4f6248}.story3d-fallback-castle{position:absolute;right:20%;bottom:22%;font-size:110px;color:#817b70;text-shadow:0 6px 0 #5a554d}.story3d-meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12px;opacity:.75}@media(max-width:520px){.story3d-shell{padding:0}.story3d-stage{border-radius:0}.story3d-head{padding:10px 12px;margin:0}.story3d-overlay{padding:12px}.story3d-skip{padding:8px 11px}}
</style>
</head>
<body>
<main class="story3d-shell">
  <div class="story3d-head"><div><small>Technik-Spike · B-013</small><h1>Festungsenthüllung</h1></div><button id="replay" type="button">Nochmal</button></div>
  <section id="story3dMount" class="story3d-stage" aria-label="3D Festungsenthüllung"></section>
  <div class="story3d-meta"><span>Three.js r186 lokal</span><span>lazy geladen</span><span>keine Lernzustände</span><span id="story3dStatus">Start</span></div>
</main>
<script type="module">
import {startFortressReveal,stopStory3D} from './js/story-3d/story-scene-controller.js?v=0.21.58';
const mount=document.querySelector('#story3dMount'),status=document.querySelector('#story3dStatus');
async function run(){
  stopStory3D();status.textContent='läuft';
  await startFortressReveal({
    mount,
    subject:new URLSearchParams(location.search).get('subject')||'english',
    reducedMotion:matchMedia('(prefers-reduced-motion: reduce)').matches,
    onComplete:()=>status.textContent='fertig',
    onSkip:()=>status.textContent='übersprungen',
    onError:()=>status.textContent='Fallback'
  });
}
document.querySelector('#replay').addEventListener('click',run);
run();
</script>
</body>
</html>
